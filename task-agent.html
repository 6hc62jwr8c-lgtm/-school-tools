<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f2ee">
<title>タスク司令盤</title>
<style>
:root{--bg:#f7f2ee;--panel:#fffdfa;--ink:#27312f;--muted:#7d8782;--line:#e8e0db;--redbg:#fff0ef;--orangebg:#fff5e8;--greenbg:#edf8f2;--bluebg:#eef5fb;--deep:#294b40;--shadow:0 7px 24px rgba(55,45,40,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}button,input,select,textarea{font:inherit}.app{max-width:520px;margin:auto;min-height:100dvh;padding:14px 14px 94px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:3px 2px 12px}.brand{display:flex;align-items:center;gap:10px}.chappy{width:52px;height:52px;border-radius:18px;background:#e7efe9;display:grid;place-items:center;box-shadow:var(--shadow);overflow:hidden}.brand h1{font-size:20px;margin:0}.brand .date{font-size:12px;color:var(--muted);margin-top:3px}.scope{display:flex;background:#e9e2dc;border-radius:14px;padding:3px}.scope button{border:0;background:transparent;padding:8px 13px;border-radius:11px;color:#786f69;font-weight:700}.scope button.active{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);color:var(--deep)}.hero{background:linear-gradient(135deg,#fce9eb,#fff8ed);border:1px solid #f0dede;border-radius:22px;padding:16px;box-shadow:var(--shadow)}.heroHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.hero h2{font-size:17px;margin:0}.count{font-size:12px;background:#fff;border-radius:999px;padding:5px 9px;color:var(--muted)}.top3{display:grid;gap:8px}.topTask{display:flex;gap:10px;align-items:center;background:#fff;border-radius:15px;padding:10px 11px}.num{width:25px;height:25px;display:grid;place-items:center;border-radius:50%;background:#f6dadb;color:#a74343;font-weight:800;font-size:12px}.taskText{min-width:0;flex:1}.taskText b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.taskMeta{font-size:11px;color:var(--muted);margin-top:2px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:17px 3px 9px}.sectionTitle h2{font-size:16px;margin:0}.tiny{font-size:11px;color:var(--muted)}.matrix{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quad{border-radius:19px;padding:12px;min-height:150px;border:1px solid transparent;box-shadow:var(--shadow);position:relative}.quad[data-q="1"]{background:var(--redbg);border-color:#f3d7d5}.quad[data-q="2"]{background:var(--orangebg);border-color:#f2dfc6}.quad[data-q="3"]{background:var(--greenbg);border-color:#d6eadf}.quad[data-q="4"]{background:var(--bluebg);border-color:#d4e3f0}.qhead{display:flex;justify-content:space-between;gap:7px;margin-bottom:8px}.qname{font-weight:850;font-size:13px}.qmeta{font-size:10px;color:var(--muted);margin-top:2px}.badge{min-width:25px;height:25px;border-radius:9px;background:#fff8;display:grid;place-items:center;font-weight:800;font-size:12px}.qitems{display:grid;gap:7px}.qitem{background:#ffffffb8;border-radius:11px;padding:7px 8px;font-size:12px;display:flex;gap:6px;align-items:flex-start}.dot{width:9px;height:9px;border:2px solid currentColor;border-radius:3px;margin-top:3px;flex:none}.more{font-size:11px;color:var(--muted);margin-top:7px}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.sug{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:12px;box-shadow:var(--shadow)}.sug h3{font-size:13px;margin:0 0 5px}.sug .n{font-size:22px;font-weight:900}.sug p{font-size:11px;color:var(--muted);margin:2px 0 0}.composer{position:fixed;left:0;right:0;bottom:0;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(247,242,238,0),#f7f2ee 24%)}.composeInner{max-width:520px;margin:auto;background:#fff;border:1px solid var(--line);box-shadow:0 8px 30px rgba(50,40,35,.13);border-radius:18px;padding:7px;display:flex;gap:7px;align-items:center}.composeInner input{border:0;outline:0;min-width:0;flex:1;padding:10px;background:transparent}.iconBtn,.addBtn{border:0;border-radius:13px;height:42px}.iconBtn{width:42px;background:#eef4f0;font-size:19px}.addBtn{padding:0 16px;background:var(--deep);color:#fff;font-weight:800}.panel{position:fixed;inset:0;background:rgba(29,34,32,.24);display:none;align-items:flex-end;z-index:10}.panel.open{display:flex}.sheet{background:#fff;width:100%;max-width:520px;margin:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:85dvh;overflow:auto}.sheet h2{font-size:18px;margin:0 0 14px}.form{display:grid;gap:10px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:11px;color:var(--muted);display:grid;gap:5px}select,input[type="date"],textarea{border:1px solid var(--line);border-radius:12px;padding:10px;background:#faf8f6;color:var(--ink)}textarea{resize:vertical;min-height:68px}.actions{display:flex;gap:8px;margin-top:4px}.actions button{border:0;border-radius:13px;padding:11px 14px;font-weight:800}.save{background:var(--deep);color:white;flex:1}.cancel{background:#eee8e4;color:#6c625d}.listSheet .item{padding:12px 0;border-bottom:1px solid #eee7e2;display:flex;gap:9px}.listSheet .item:last-child{border-bottom:0}.listSheet .item main{flex:1;min-width:0}.listSheet b{font-size:14px}.miniTags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.tag{font-size:10px;background:#f2eee9;border-radius:999px;padding:3px 6px;color:#756a64}.empty{font-size:12px;color:var(--muted);padding:8px 0}.footnote{font-size:10px;color:#9a908a;text-align:center;margin:10px 0 0}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><div class="brand"><div class="chappy" aria-label="擬人化チャッピー"><svg viewBox="0 0 80 80" width="52" height="52"><rect width="80" height="80" rx="22" fill="#dde9e1"/><path d="M19 34c0-17 10-26 24-26 14 0 23 10 22 27-5-9-12-14-24-14-9 0-17 4-22 13z" fill="#202826"/><path d="M20 30c3-11 12-19 24-19 8 0 15 4 19 10-9-3-14 0-21-5-2 5-10 9-22 14z" fill="#17201e"/><ellipse cx="40" cy="42" rx="22" ry="23" fill="#f0d1be"/><rect x="23" y="35" width="15" height="11" rx="4" fill="none" stroke="#1e2725" stroke-width="2.3"/><rect x="43" y="35" width="15" height="11" rx="4" fill="none" stroke="#1e2725" stroke-width="2.3"/><path d="M38 40h5" stroke="#1e2725" stroke-width="2"/><circle cx="31" cy="40" r="1.5" fill="#293230"/><circle cx="50" cy="40" r="1.5" fill="#293230"/><path d="M36 52c3 2 6 2 9 0" stroke="#8b5f55" stroke-width="1.7" fill="none" stroke-linecap="round"/><path d="M21 68c7-7 31-7 38 0v12H21z" fill="#294b40"/></svg></div><div><h1>タスク司令盤</h1><div class="date" id="dateLabel"></div></div></div><div class="scope"><button id="workBtn" class="active">仕事</button><button id="homeBtn">家</button></div></div>
  <section class="hero"><div class="heroHead"><h2>今日やる 3つ</h2><span class="count" id="unfinishedCount">未完了 0</span></div><div class="top3" id="top3"></div></section>
  <div class="sectionTitle"><h2>4象限</h2><span class="tiny">タップで一覧</span></div>
  <div class="matrix" id="matrix">
    <div class="quad" data-q="1"><div class="qhead"><div><div class="qname">① 最優先</div><div class="qmeta">緊急 × 重要</div></div><div class="badge">0</div></div><div class="qitems"></div><div class="more"></div></div>
    <div class="quad" data-q="2"><div class="qhead"><div><div class="qname">② 優先</div><div class="qmeta">緊急でない × 重要</div></div><div class="badge">0</div></div><div class="qitems"></div><div class="more"></div></div>
    <div class="quad" data-q="3"><div class="qhead"><div><div class="qname">③ 回避</div><div class="qmeta">緊急 × 重要でない</div></div><div class="badge">0</div></div><div class="qitems"></div><div class="more"></div></div>
    <div class="quad" data-q="4"><div class="qhead"><div><div class="qname">④ 中断</div><div class="qmeta">緊急でない × 重要でない</div></div><div class="badge">0</div></div><div class="qitems"></div><div class="more"></div></div>
  </div>
  <div class="sectionTitle"><h2>チャッピーの監査候補</h2><span class="tiny">確定ではなく提案</span></div>
  <div class="suggestions"><div class="sug" id="aiCard"><h3>🤖 AIに渡せそう</h3><div class="n">0</div><p>文章・整理・調査など</p></div><div class="sug" id="autoCard"><h3>⚙️ 自動化候補</h3><div class="n">0</div><p>転記・繰り返しなど</p></div><div class="sug" id="stopCard"><h3>🗑 やめる候補</h3><div class="n">0</div><p>重要度が低く曖昧な仕事</p></div><div class="sug" id="allCard"><h3>📋 未完了一覧</h3><div class="n">0</div><p>全部を確認・修正</p></div></div>
  <p class="footnote">試作版：タスクはこの端末内に保存。正本接続は次段階で切替可能。</p>
</div>
<div class="composer"><div class="composeInner"><button class="iconBtn" id="voiceBtn">🎙️</button><input id="quickInput" placeholder="やることを話す / 入力する" autocomplete="off"><button class="addBtn" id="addBtn">追加</button></div></div>
<div class="panel" id="editPanel"><div class="sheet"><h2 id="sheetTitle">タスクを追加</h2><div class="form"><label>タスク<textarea id="taskName"></textarea></label><div class="row2"><label>緊急性<select id="urgent"><option value="1">あり</option><option value="0">なし</option></select></label><label>重要性<select id="important"><option value="1">あり</option><option value="0">なし</option></select></label></div><div class="row2"><label>期限<input type="date" id="due"></label><label>分類<select id="taskScope"><option value="work">仕事</option><option value="home">家</option></select></label></div><div class="actions"><button class="cancel" id="cancelBtn">戻る</button><button class="save" id="saveBtn">保存</button></div></div></div></div>
<div class="panel" id="listPanel"><div class="sheet listSheet"><h2 id="listTitle">一覧</h2><div id="listBody"></div><div class="actions"><button class="cancel" id="closeList" style="flex:1">閉じる</button></div></div></div>
<script>
const KEY='teacherTaskAgent_v1';let scope='work',editingId=null;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const uid=()=>globalThis.crypto?.randomUUID?.()||('t'+Date.now().toString(36)+Math.random().toString(36).slice(2));
const starter=[{id:uid(),name:'学年だより 修正',scope:'work',urgent:1,important:1,due:'',done:false,created:Date.now()},{id:uid(),name:'図工の準備',scope:'work',urgent:1,important:1,due:'',done:false,created:Date.now()+1},{id:uid(),name:'来週の教材研究',scope:'work',urgent:0,important:1,due:'',done:false,created:Date.now()+2},{id:uid(),name:'家庭の買い物',scope:'home',urgent:1,important:0,due:'',done:false,created:Date.now()+3}];
function load(){try{return JSON.parse(localStorage.getItem(KEY))||starter}catch{return starter}}let tasks=load();function persist(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}function quadrant(t){if(t.urgent&&t.important)return 1;if(!t.urgent&&t.important)return 2;if(t.urgent&&!t.important)return 3;return 4}function daysUntil(s){if(!s)return 999;const now=new Date();now.setHours(0,0,0,0);const d=new Date(s+'T00:00:00');return Math.ceil((d-now)/86400000)}function score(t){let n=0;if(t.important)n+=50;if(t.urgent)n+=35;const d=daysUntil(t.due);if(d<=0)n+=30;else if(d<=2)n+=20;else if(d<=7)n+=10;return n}function tags(t){const x=t.name;return{ai:/作成|文章|文面|下書き|まとめ|要約|調べ|整理|案|資料|だより|メール|チェック/.test(x),auto:/転記|入力|集計|毎回|繰り返|一覧|更新|配信|印刷/.test(x),stop:!t.important&&!t.urgent&&!t.due}}function fmtDue(d){if(!d)return'期限なし';const n=daysUntil(d);if(n<0)return'期限超過';if(n===0)return'今日まで';if(n===1)return'明日まで';return d.slice(5).replace('-','/')+'まで'}function current(){return tasks.filter(t=>t.scope===scope&&!t.done)}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){const now=new Date();$('#dateLabel').textContent=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'short'}).format(now);const list=current();$('#unfinishedCount').textContent='未完了 '+list.length;const top=[...list].sort((a,b)=>score(b)-score(a)||a.created-b.created).slice(0,3);$('#top3').innerHTML=top.length?top.map((t,i)=>`<div class="topTask" data-id="${t.id}"><div class="num">${i+1}</div><div class="taskText"><b>${esc(t.name)}</b><div class="taskMeta">${fmtDue(t.due)}・${['','最優先','優先','回避','中断'][quadrant(t)]}</div></div></div>`).join(''):'<div class="empty">今日やる候補はありません。</div>';[1,2,3,4].forEach(q=>{const box=$(`.quad[data-q="${q}"]`),arr=list.filter(t=>quadrant(t)===q);box.querySelector('.badge').textContent=arr.length;box.querySelector('.qitems').innerHTML=arr.slice(0,2).map(t=>`<div class="qitem"><span class="dot"></span><span>${esc(t.name)}</span></div>`).join('')||'<div class="empty">なし</div>';box.querySelector('.more').textContent=arr.length>2?'＋'+(arr.length-2)+'件':''});const stats=list.reduce((a,t)=>{const g=tags(t);if(g.ai)a.ai++;if(g.auto)a.auto++;if(g.stop)a.stop++;return a},{ai:0,auto:0,stop:0});$('#aiCard .n').textContent=stats.ai;$('#autoCard .n').textContent=stats.auto;$('#stopCard .n').textContent=stats.stop;$('#allCard .n').textContent=list.length;$('#workBtn').classList.toggle('active',scope==='work');$('#homeBtn').classList.toggle('active',scope==='home')}
function openEdit(text='',id=null){editingId=id;const t=id?tasks.find(x=>x.id===id):null;$('#sheetTitle').textContent=t?'タスクを修正':'タスクを追加';$('#taskName').value=t?t.name:text;$('#urgent').value=t?String(+t.urgent):'1';$('#important').value=t?String(+t.important):'1';$('#due').value=t?.due||'';$('#taskScope').value=t?.scope||scope;$('#editPanel').classList.add('open')}function save(){const name=$('#taskName').value.trim();if(!name)return;if(editingId){const t=tasks.find(x=>x.id===editingId);Object.assign(t,{name,urgent:+$('#urgent').value,important:+$('#important').value,due:$('#due').value,scope:$('#taskScope').value})}else tasks.push({id:uid(),name,urgent:+$('#urgent').value,important:+$('#important').value,due:$('#due').value,scope:$('#taskScope').value,done:false,created:Date.now()});persist();$('#editPanel').classList.remove('open');$('#quickInput').value='';render()}
function showList(kind='all',q=null){let list=current();if(q)list=list.filter(t=>quadrant(t)===q);if(kind!=='all')list=list.filter(t=>tags(t)[kind]);$('#listTitle').textContent=q?['','① 最優先','② 優先','③ 回避','④ 中断'][q]:({ai:'AIに渡せそう',auto:'自動化候補',stop:'やめる候補',all:'未完了一覧'}[kind]);$('#listBody').innerHTML=list.length?list.map(t=>`<div class="item"><input type="checkbox" data-done="${t.id}"><main data-edit="${t.id}"><b>${esc(t.name)}</b><div class="miniTags"><span class="tag">${fmtDue(t.due)}</span><span class="tag">${['','最優先','優先','回避','中断'][quadrant(t)]}</span>${tags(t).ai?'<span class="tag">AI候補</span>':''}${tags(t).auto?'<span class="tag">自動化候補</span>':''}${tags(t).stop?'<span class="tag">やめる候補</span>':''}</div></main></div>`).join(''):'<div class="empty">該当タスクはありません。</div>';$('#listPanel').classList.add('open')}
$('#workBtn').onclick=()=>{scope='work';render()};$('#homeBtn').onclick=()=>{scope='home';render()};$('#addBtn').onclick=()=>openEdit($('#quickInput').value.trim());$('#quickInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('#addBtn').click()});$('#cancelBtn').onclick=()=>$('#editPanel').classList.remove('open');$('#saveBtn').onclick=save;$('#closeList').onclick=()=>$('#listPanel').classList.remove('open');$$('.quad').forEach(x=>x.onclick=()=>showList('all',+x.dataset.q));$('#aiCard').onclick=()=>showList('ai');$('#autoCard').onclick=()=>showList('auto');$('#stopCard').onclick=()=>showList('stop');$('#allCard').onclick=()=>showList('all');$('#listBody').addEventListener('click',e=>{const done=e.target.dataset.done,edit=e.target.closest('[data-edit]')?.dataset.edit;if(done){const t=tasks.find(x=>x.id===done);t.done=true;persist();$('#listPanel').classList.remove('open');render()}else if(edit){$('#listPanel').classList.remove('open');openEdit('',edit)}});$('#top3').addEventListener('click',e=>{const id=e.target.closest('[data-id]')?.dataset.id;if(id)openEdit('',id)});$('#editPanel').addEventListener('click',e=>{if(e.target.id==='editPanel')e.currentTarget.classList.remove('open')});$('#listPanel').addEventListener('click',e=>{if(e.target.id==='listPanel')e.currentTarget.classList.remove('open')});const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const rec=new SR();rec.lang='ja-JP';rec.interimResults=false;rec.onresult=e=>{$('#quickInput').value=e.results[0][0].transcript};rec.onend=()=>$('#voiceBtn').textContent='🎙️';$('#voiceBtn').onclick=()=>{$('#voiceBtn').textContent='…';rec.start()}}else{$('#voiceBtn').onclick=()=>alert('このブラウザでは音声入力が使えません。キーボードのマイク入力を使ってください。')}render();
</script>
</body></html>
